
{% extends "pgx_starfinder/base.html" %}

{% block title %}Search | PGx StarFinder{% endblock %}

{% block content %}
    <h1>Welcome to PGx_StarFinder</h1>

    <form
        id="search-form"
        action="{% url 'search' %}"
        method="post"
    >
        {% csrf_token %}

        <label for="star_allele">
           💫 Please enter a star allele:
        </label>

        <input
            type="text"
            id="star_allele"
            name="star_allele"
            value="{{ search_term|default:'' }}"
            required
        >

        <button type="submit">
            🔍 Get Star Allele Information
        </button>
    </form>

    {% if error_message %}
        <p class="error-message" role="alert">
            {{ error_message }}
        </p>
    {% endif %}
{% endblock %}
